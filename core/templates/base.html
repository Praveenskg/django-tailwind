{% load static tailwind_tags %}
<!doctype html>
<html lang="en">
  <head>
    <title>{% block title %}Django Tailwind{% endblock %}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    {% tailwind_css %}
    <style>
      body {
        font-family: "IBM Plex Sans", sans-serif;
      }

      .font-display {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>

  <body class="bg-(--foam) text-(--ink) antialiased">
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script src="{% static 'js/gsap-animations.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
